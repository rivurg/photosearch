<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>PhotoBrain</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{min-height:100vh;max-width:760px;margin:auto;display:flex;flex-direction:column}
header{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(8,8,8,.9);backdrop-filter:blur(18px);z-index:3}
.logo{font-size:22px;font-weight:800;letter-spacing:-.6px}.viral{font-size:11px;color:#888}
main{flex:1;padding:12px 16px 110px}.welcome{padding:34px 8px 20px}.welcome h1{font-size:34px;line-height:1.05;margin:0 0 10px}.welcome p{color:#999;margin:0;line-height:1.5}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 18px}.chip{border:1px solid #252525;background:#111;color:#ddd;border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:13px}
.message{display:flex;margin:16px 0}.bubble{max-width:88%;padding:12px 14px;border-radius:18px;background:#151515;line-height:1.45}.user{justify-content:flex-end}.user .bubble{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.card{background:#111;border:1px solid #222;border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.meta{padding:9px 10px;font-size:12px;color:#aaa}.meta b{color:#eee;display:block;margin-bottom:3px}
.empty{border:1px dashed #303030;border-radius:18px;padding:28px;text-align:center;color:#888;margin-top:15px}
.composer{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#080808 24%);z-index:4}.bar{max-width:760px;margin:auto;display:flex;gap:8px;background:#151515;border:1px solid #292929;border-radius:22px;padding:7px}.bar input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:10px;font-size:16px;min-width:0}.btn{border:0;border-radius:17px;padding:0 14px;background:#fff;color:#000;font-weight:700}.add{background:#222;color:#fff;border:1px solid #333;padding:10px 12px;border-radius:16px}.hidden{display:none}
.small{font-size:12px;color:#777;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">PhotoBrain</div><div class="viral">your photos, smarter</div></header>
<main id="chat">
<section class="welcome" id="welcome">
<h1>Что ищем,<br>чувак?</h1>
<p>Добавь фотографии и ищи их обычным языком — по имени файла, дате и описанию.</p>
</section>
<div class="chips">
<button class="chip" onclick="ask('Найди кроссовки')">👟 Кроссовки</button>
<button class="chip" onclick="ask('Покажи последние фото')">🕐 Последние</button>
<button class="chip" onclick="ask('Найди фото с курткой')">🧥 Куртка</button>
<button class="chip" onclick="ask('Покажи все фото')">🖼️ Все фото</button>
</div>
<div id="messages"></div>
</main>
<div class="composer">
<div class="bar">
<button class="add" onclick="document.getElementById('picker').click()">＋</button>
<input id="query" placeholder="Например: мои кроссовки">
<button class="btn" onclick="send()">➤</button>
</div>
<input id="picker" class="hidden" type="file" accept="image/*" multiple onchange="addPhotos(event)">
<div class="small" id="status">Фото хранятся локально в этой вкладке.</div>
</div>
</div>
<script>
let photos=[];
const messages=document.getElementById('messages');
const status=document.getElementById('status');

function addPhotos(e){
  const files=[...e.target.files];
  files.forEach(file=>{
    photos.push({
      name:file.name,
      date:new Date(file.lastModified||Date.now()),
      url:URL.createObjectURL(file),
      size:file.size
    });
  });
  status.textContent=`Загружено фотографий: ${photos.length}`;
  if(files.length) addBot(`Добавил ${files.length} фото. Теперь можешь спросить, что найти.`);
  e.target.value='';
}
function bubble(text, who='bot'){
  const row=document.createElement('div'); row.className='message '+(who==='user'?'user':'');
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
  row.appendChild(b); messages.appendChild(row);
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function addBot(text){bubble(text,'bot')}
function addUser(text){bubble(text,'user')}

function tokenize(s){return s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').split(/\s+/).filter(x=>x.length>1)}
function search(q){
  if(!photos.length) return [];
  const words=tokenize(q);
  const stop=new Set(['найди','покажи','фото','фотку','фотки','мои','все','с','на','и','за','последние','последнюю','мне']);
  const terms=words.filter(x=>!stop.has(x));
  return photos.map(p=>{
    const text=(p.name+' '+p.date.toLocaleDateString('ru-RU')).toLowerCase();
    let score=0;
    terms.forEach(t=>{if(text.includes(t)) score+=3;});
    if(q.toLowerCase().includes('послед') ) score += p.date.getTime()/1e13;
    if(q.toLowerCase().includes('все')) score+=1;
    return {...p,score};
  }).filter(p=>p.score>0 || terms.length===0).sort((a,b)=>b.score-a.score);
}
function render(results){
  const wrap=document.createElement('div'); wrap.className='grid';
  results.slice(0,20).forEach(p=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<img src="${p.url}" alt=""><div class="meta"><b>${escapeHtml(p.name)}</b>${p.date.toLocaleDateString('ru-RU')}</div>`;
    wrap.appendChild(c);
  });
  messages.appendChild(wrap);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function ask(q){document.getElementById('query').value=q;send()}
function send(){
  const input=document.getElementById('query'); const q=input.value.trim(); if(!q)return;
  addUser(q); input.value='';
  const results=search(q);
  if(!photos.length){addBot('Сначала нажми ＋ и выбери фотографии из медиатеки iPhone.');return;}
  if(!results.length){addBot('Пока ничего подходящего не нашёл. Попробуй другое описание или имя файла.');return;}
  addBot(`Нашёл ${results.length} подходящих фото:`);
  render(results);
}
document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
